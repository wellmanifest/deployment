name: deployment-dsl-ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    if: >-
      (github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
      (github.event.action == 'submitted' ||
      (github.event.action == 'dismissed' &&
      github.event.review.commit_id == github.event.pull_request.head.sha)))
    permissions:
      contents: read
      pull-requests: read
    uses: wellmanifest/new-project/.github/workflows/governance.yml@3549d21a5a31fea87b2dd4da37d8e8bd793f20f6
    with:
      standard-ref: 3549d21a5a31fea87b2dd4da37d8e8bd793f20f6
      trusted-validator-apps: 'ifuri-validator-agent[bot]'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable DSL standard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: wellmanifest/dsl
          ref: 550e5f441c709e15f2679c1af151352d1eba2f1e
          path: vendor/dsl
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Resolve exact change boundary
        id: revision
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE_SHA"
          mode=range
          if [[ ! "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'event head is not an exact Git SHA' >&2
            exit 1
          fi
          git cat-file -e "$EVENT_HEAD_SHA^{commit}"
          if [[ ("$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch) &&
                "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            mode=repository
          elif [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if [[ "$mode" == range ]]; then
            git cat-file -e "$base^{commit}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Validate governance and deployment DSL
        shell: bash
        env:
          BASE_SHA: ${{ steps.revision.outputs.base }}
          HEAD_SHA: ${{ steps.revision.outputs.head }}
          VALIDATION_MODE: ${{ steps.revision.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ -f dsl-manifest.json ]]; then
            python3 vendor/dsl/src/dsl_check.py validate --root . dsl-manifest.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('schemas/deployment.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          examples = schema.get('examples', [])
          if not examples:
              raise SystemExit('schema must contain at least one canonical example')
          for index, example in enumerate(examples):
              validator.validate(example)
              print(f'example PASS: {index + 1}')
          PY
            if [[ "$VALIDATION_MODE" == range ]]; then
              python3 vendor/dsl/src/dsl_check.py changes --root . --base "$BASE_SHA" --head "$HEAD_SHA"
            else
              python3 vendor/dsl/src/dsl_check.py changes --root . --changed-file dsl-manifest.json
            fi
            python3 - "$HEAD_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = {
              'schema': 'wellmanifest.dsl/findings/v1',
              'producer': {
                  'id': 'wellmanifest.deployment-schema',
                  'version': '0.1.0',
                  'adapter': 'Draft202012Validator plus immutable wellmanifest/dsl gate',
              },
              'subject': {
                  'repository': 'https://github.com/wellmanifest/deployment',
                  'revision': sys.argv[1],
                  'manifest': 'dsl-manifest.json',
              },
              'evaluable': True,
              'failureReason': None,
              'findings': [],
          }
          Path('/tmp/deployment-findings.json').write_text(json.dumps(report))
          PY
            python3 vendor/dsl/src/dsl_check.py gate --root . dsl-manifest.json \
              --revision "$HEAD_SHA" --findings /tmp/deployment-findings.json
          fi
          governance_args=(--root . --manifest .governance/manifest.json \
            --lock .governance/manifest.lock.json \
            --stack-profiles .governance/stack-profiles.json --actor ci)
          if [[ "$VALIDATION_MODE" == range ]]; then
            governance_args+=(--base "$BASE_SHA" --head "$HEAD_SHA")
          else
            governance_args+=(--changed-file project/TICKETS.md)
          fi
          python3 .governance/governance_check.py "${governance_args[@]}"
      - name: Run networkless Docker conformance
        if: ${{ hashFiles('dsl-manifest.json') != '' }}
        run: |
          docker build -t wellmanifest-deployment-ci .
          docker run --rm --network none wellmanifest-deployment-ci

  windows-governance:
    runs-on: windows-latest
    steps:
      - name: Preserve managed LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Validate Windows governance entrypoint
        shell: pwsh
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'invalid head SHA' }
          $repositoryMode = (
            ($env:EVENT_NAME -eq 'push' -or $env:EVENT_NAME -eq 'workflow_dispatch') -and
            $env:REF_NAME -eq $env:DEFAULT_BRANCH
          )
          if ($repositoryMode) {
            ./project.bat --actor ci --changed-file project/TICKETS.md
          } else {
            $base = $env:EVENT_BASE_SHA
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -eq ('0' * 40)) {
              $base = (git rev-parse 'HEAD^').Trim()
            }
            ./project.bat --actor ci --base $base --head $env:EVENT_HEAD_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Windows governance failed' }
